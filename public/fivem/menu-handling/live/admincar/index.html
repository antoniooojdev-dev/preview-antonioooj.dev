<!DOCTYPE html>
<html lang="es">
<head>
    <meta name="robots" content="noindex">
    <meta charset="UTF-8">
    <title>Admincar · Handling</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../fa/css/fontawesome.min.css">
    <link rel="stylesheet" href="../fa/css/solid.min.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="themes.css">
    <link rel="stylesheet" href="scene.css">
</head>
<body>
    <div id="scene"></div>
    <div id="app" class="hidden">
        <aside class="panel" id="panel">
            <header class="hd">
                <div class="hd-top">
                    <div class="hd-img" id="v-img"><i class="fa-solid fa-car-side"></i></div>
                    <div class="grow">
                        <span class="kicker">PANEL DE ADMIN</span>
                        <h1 id="v-name">—</h1>
                        <span class="hd-sub" id="v-sub"></span>
                        <button class="spawn-id hidden" id="v-spawn" title="Copiar el ID de spawneo"><span class="mono" id="v-spawn-txt"></span><i class="fa-solid fa-copy"></i></button>
                    </div>
                    <div class="hd-tools"><button class="expand-btn sync-btn reset-btn" data-reset-all title="Devuelve este vehículo a su handling de fábrica para todos"><i class="fa-solid fa-arrow-rotate-left"></i><span>Reiniciar ajustes</span></button><button class="expand-btn sync-btn" data-sync title="Vuelve a leer los vehículos del servidor (por si has metido alguno nuevo) y el handling guardado"><i class="fa-solid fa-rotate"></i><span>Sincronizar</span></button><button class="expand-btn" data-expand title="Ver el editor en grande"><i class="fa-solid fa-expand"></i><span>Ampliar</span></button></div>
                    <div class="hd-btns">
                        <button class="ibtn" id="btn-close" title="Cerrar (ESC)"><i class="fa-solid fa-xmark"></i></button>
                        <button class="ibtn" id="btn-pick" title="Elegir cualquier vehículo del servidor"><i class="fa-solid fa-house"></i></button>
                    </div>
                </div>
                <div class="status" id="status"></div>
            </header>

            <section class="dash" id="dash">
                <div class="tele">
                    <div class="tl-speed"><b class="mono" id="t-kmh">0</b><small>km/h</small></div>
                    <div><b class="mono" id="t-gear">N</b><small>marcha</small></div>
                    <div><b class="mono" id="t-100">—</b><small>0-100</small></div>
                    <div><b class="mono" id="t-max">0</b><small>máx.</small></div>
                    <div class="tl-rpm"><span class="rpm"><i id="t-rpm"></i></span></div>
                </div>
                <div class="profile" id="profile"></div>
            </section>

            <nav class="modes" id="modes">
                <span class="mode-ink" id="mode-ink"></span>
                <button data-mode="quick" class="active"><i class="fa-solid fa-wand-magic-sparkles"></i>Ajuste rápido</button>
                <button data-mode="adv"><i class="fa-solid fa-sliders"></i>Avanzado</button>
                <button data-mode="changes"><i class="fa-solid fa-list"></i>Cambios <span class="badge" id="badge">0</span></button>
            </nav>

            <main class="body" id="body"></main>

            <footer class="ft" id="ft">
                <div class="ft-row">
                    <button class="ibtn" id="btn-undo" title="Deshacer (Ctrl+Z)"><i class="fa-solid fa-rotate-left"></i></button>
                    <button class="ibtn" id="btn-redo" title="Rehacer (Ctrl+Y)"><i class="fa-solid fa-rotate-right"></i></button>
                    <button class="btn ghost" id="btn-drive" title="Suelta el ratón y conduce con el panel abierto">
                        <i class="fa-solid fa-gamepad"></i><span>Conducir</span><kbd id="k-focus">RePág</kbd>
                    </button>
                </div>
                <div class="ft-row">
                    <button class="btn primary grow" id="btn-save"><i class="fa-solid fa-floppy-disk"></i><span id="save-txt">Guardar cambios</span></button>
                </div>
            </footer>
            <section class="picker hidden" id="picker">
                <div class="pk-head">
                    <span class="pk-ico"><i class="fa-solid fa-screwdriver-wrench"></i></span>
                    <div class="grow"><span class="kicker">PANEL DE ADMIN</span><b>MENÚ DE HANDLING</b></div>
                    <div class="hd-tools"><button class="expand-btn sync-btn" data-sync title="Vuelve a leer los vehículos del servidor (por si has metido alguno nuevo) y el handling guardado"><i class="fa-solid fa-rotate"></i><span>Sincronizar</span></button><button class="expand-btn" data-expand title="Ver el editor en grande"><i class="fa-solid fa-expand"></i><span>Ampliar</span></button></div>
                </div>
                <div class="pk-tools">
                    <div class="search"><i class="fa-solid fa-magnifying-glass"></i><input id="pk-q" placeholder="Nombre o ID de spawneo…" spellcheck="false"></div>
                    <div class="groups" id="pk-types"></div>
                </div>
                <div class="pk-list" id="pk-list"></div>
            </section>
        </aside>

        <div class="drive hidden" id="drive">
            <div class="dv-head">
                <span class="dv-dot"></span>
                <div class="grow"><small>Probando</small><b id="d-name">—</b></div>
                <span class="dv-state" id="d-state">Tus cambios</span>
            </div>
            <div class="dv-tele">
                <div class="dv-speed"><b class="mono" id="d-kmh">0</b><small>km/h</small></div>
                <div><b class="mono" id="d-gear">N</b><small>marcha</small></div>
                <div><b class="mono" id="d-100">—</b><small>0-100</small></div>
                <div><b class="mono" id="d-max">0</b><small>máx.</small></div>
            </div>
            <span class="rpm"><i id="d-rpm"></i></span>
            <div class="dv-keys">
                <span><kbd id="k-focus2">RePág</kbd> volver al panel</span>
                <span><kbd id="k-compare">AvPág</kbd> comparar con fábrica</span>
            </div>
        </div>
    </div>
    <div class="lightbox hidden" id="lightbox">
        <figure class="lb-card">
            <img id="lb-img" alt="">
            <figcaption><b id="lb-name"></b><span class="mono" id="lb-spawn"></span></figcaption>
        </figure>
    </div>
    <div class="confirm hidden" id="confirm">
        <div class="cf-card">
            <span class="cf-ico"><i class="fa-solid fa-arrow-rotate-left"></i></span>
            <b id="cf-title">¿Reiniciar los ajustes?</b>
            <p id="cf-text"></p>
            <div class="cf-btns"><button class="btn" id="cf-no">Cancelar</button><button class="btn primary danger-yes" id="cf-yes"><i class="fa-solid fa-arrow-rotate-left"></i><span>Reiniciar de fábrica</span></button></div>
        </div>
    </div>
    <div id="toasts"></div>
    <script src="shim.js"></script>
    <script src="handling.js"></script>
    <script src="app.js"></script>
    <script src="demo.js"></script>
    <script src="scene.js"></script>
</body>
</html>
